[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "payload2recovery"
version = "1.1.0"
description = "Repackage Android OTA payloads into custom-recovery flashable ZIPs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "payload2recovery contributors" },
]
keywords = ["android", "ota", "payload", "recovery", "twrp"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "brotli>=1.1.0",
  "rich>=13.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.11",
  "mypy>=1.15",
  "pre-commit>=4.2",
]

[project.scripts]
payload2recovery = "payload2recovery.cli:main"
p2r = "payload2recovery.cli:main"

[tool.hatch.build]
include = [
  "/README.md",
  "/LICENSE",
  "/src/payload2recovery/**/*.py",
  "/src/payload2recovery/assets/bin/avbctl",
  "/src/payload2recovery/assets/bin/payload-dumper-go",
  "/src/payload2recovery/assets/bin/update-binary",
  "/src/payload2recovery/assets/bin/magiskboot",
  "/src/payload2recovery/assets/config/default_partitions.txt",
  "/src/payload2recovery/assets/scripts/*.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payload2recovery"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["src/payload2recovery/assets/scripts/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = [
  "src/payload2recovery/assets/scripts/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
