[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "payload2recovery"
version = "1.1.0"
description = "Repackage Android OTA payloads into custom-recovery flashable ZIPs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "payload2recovery contributors" },
]
keywords = ["android", "ota", "payload", "recovery", "twrp"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "brotli>=1.1.0",
  "rich>=13.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
]

[project.scripts]
payload2recovery = "payload2recovery.cli:main"
p2r = "payload2recovery.cli:main"
port2recovery = "port2recovery.cli:main"
pt2r = "port2recovery.cli:main"

[tool.hatch.build]
include = [
  "/README.md",
  "/LICENSE",
  "/src/payload2recovery/**/*.py",
  "/src/payload2recovery/assets/bin/payload-dumper-go",
  "/src/payload2recovery/assets/bin/update-binary",
  "/src/payload2recovery/assets/config/default_partitions.txt",
  "/src/payload2recovery/assets/scripts/*.py",
  "/src/port2recovery/**/*.py",
  "/src/port2recovery/assets/config/port2recovery_default_partitions.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payload2recovery", "src/port2recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
